name: Laravel CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Validate, audit, lint, analyse, and test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: netsales_test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: netsales_test_db
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, intl, zip
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Prepare test environment
        run: cp .env.example .env

      - name: Install locked dependencies
        id: dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Generate application key for tests
        id: application-key
        run: php artisan key:generate --force

      - name: Migrate and seed test database
        id: database-setup
        run: php artisan migrate:fresh --seed --force

      - name: Audit Composer dependencies
        id: composer-audit
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: composer audit
        continue-on-error: true

      - name: Check PHP code style
        id: pint
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: vendor/bin/pint --test --diff
        continue-on-error: true

      - name: Run targeted Larastan / PHPStan analysis
        id: phpstan
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: vendor/bin/phpstan analyse app/Services/SaleInvoiceService.php tests/Feature/Milestone4CConcurrencyAndDirectInvoiceDebtTest.php --no-progress --memory-limit=1G
        continue-on-error: true

      - name: Run full project PHPStan analysis (existing baseline visibility)
        id: phpstan-full
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
        continue-on-error: true

      - name: Run targeted direct-credit invoice regression
        id: phpunit
        if: ${{ always() && steps.dependencies.outcome == 'success' && steps.application-key.outcome == 'success' && steps.database-setup.outcome == 'success' }}
        run: php artisan test --filter=test_direct_credit_invoice_accounting_and_repayment_settlement
        continue-on-error: true

      - name: Run full Laravel test suite (existing failures remain visible)
        id: phpunit-full
        if: ${{ always() && steps.dependencies.outcome == 'success' && steps.application-key.outcome == 'success' && steps.database-setup.outcome == 'success' }}
        run: php artisan test
        continue-on-error: true

      - name: Enforce all quality gates
        if: always()
        run: |
          failed=0
          if [ "${{ steps.dependencies.outcome }}" != "success" ]; then
            echo "Composer dependency installation failed."
            failed=1
          fi
          if [ "${{ steps.application-key.outcome }}" != "success" ]; then
            echo "Test application key generation failed."
            failed=1
          fi
          if [ "${{ steps.database-setup.outcome }}" != "success" ]; then
            echo "MySQL migration or seed setup failed."
            failed=1
          fi
          if [ "${{ steps.composer-audit.outcome }}" != "success" ]; then
            echo "Composer security audit failed; dependency advisories remain unresolved."
            failed=1
          fi
          if [ "${{ steps.pint.outcome }}" != "success" ]; then
            echo "Laravel Pint style check failed."
            failed=1
          fi
          if [ "${{ steps.phpstan.outcome }}" != "success" ]; then
            echo "Larastan / PHPStan analysis failed."
            failed=1
          fi
          if [ "${{ steps.phpunit.outcome }}" != "success" ]; then
            echo "Targeted direct-credit invoice regression failed or could not run."
            failed=1
          fi
          if [ "${{ steps.phpstan-full.outcome }}" != "success" ]; then
            echo "NOTE: Full-project PHPStan has pre-existing baseline errors; see the full analysis step."
          fi
          if [ "${{ steps.phpunit-full.outcome }}" != "success" ]; then
            echo "NOTE: Full Laravel suite has existing failures outside this targeted financial regression; see the full suite step."
          fi
          exit "$failed"
