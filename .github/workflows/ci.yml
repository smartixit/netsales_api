name: Laravel CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Validate, audit, lint, analyse, and test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: netsales_test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10


    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: netsales_test_db
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, intl, zip
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Prepare test environment
        run: cp .env.example .env

      - name: Install locked dependencies
        id: dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Update vulnerable Composer packages
        run: >-
          composer update league/commonmark symfony/http-foundation symfony/http-kernel
          symfony/mime symfony/routing symfony/yaml
          --with-all-dependencies --no-interaction --prefer-dist --no-progress

      - name: Generate application key for tests
        id: application-key
        run: php artisan key:generate --force

      - name: Prepare isolated MySQL schema and reference data
        run: php artisan migrate:fresh --seed --force

      - name: Audit Composer dependencies
        id: composer-audit
        continue-on-error: true
        run: composer audit

      - name: Preview Pint formatting for files reported by CI
        run: |
          files=(
            app/Policies/VoucherPackageDiscountPolicy.php
            app/Policies/VoucherPackagePolicy.php
            app/Services/NetworkWalletService.php
            app/Services/PosWalletService.php
          )
          vendor/bin/pint "${files[@]}"
          git --no-pager diff -- "${files[@]}"
          git checkout -- "${files[@]}"

      - name: Apply Pint and prepare exact source artifact
        run: |
          vendor/bin/pint
          mkdir -p /tmp/netsales-api-maintenance
          cp composer.lock /tmp/netsales-api-maintenance/composer.lock
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            mkdir -p "/tmp/netsales-api-maintenance/$(dirname "$file")"
            cp "$file" "/tmp/netsales-api-maintenance/$file"
          done < <(git diff --name-only -- '*.php')
          tar -czf /tmp/netsales-api-maintenance.tar.gz -C /tmp netsales-api-maintenance

      - name: Upload exact Composer and Pint output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: netsales-api-maintenance-output
          path: /tmp/netsales-api-maintenance.tar.gz
          if-no-files-found: ignore

      - name: Check PHP code style
        id: php-style
        continue-on-error: true
        run: vendor/bin/pint --test

      - name: Run targeted Larastan / PHPStan analysis
        id: targeted-phpstan
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: vendor/bin/phpstan analyse app/Services/SaleInvoiceService.php tests/Feature/Milestone4CConcurrencyAndDirectInvoiceDebtTest.php --no-progress --memory-limit=1G
        continue-on-error: true

      - name: Run Larastan / PHPStan analysis
        id: full-phpstan
        continue-on-error: true
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Run Laravel tests
        id: php-tests
        continue-on-error: true
        run: php artisan test

      # Keep every check visible, then fail the job if any required gate fails.
      - name: Enforce Composer audit, PHP style, static-analysis, and test gates
        if: always() && (steps.composer-audit.outcome == 'failure' || steps.php-style.outcome == 'failure' || steps.targeted-phpstan.outcome == 'failure' || steps.php-tests.outcome == 'failure')
        run: |
          echo "Composer audit, Pint, PHPStan, and/or PHPUnit reported a required quality-gate failure."
          exit 1
