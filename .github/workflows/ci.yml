name: Laravel CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Validate, audit, lint, analyse, and test
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, intl, zip
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Prepare test environment
        run: cp .env.example .env

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Generate application key for tests
        run: php artisan key:generate --force

      - name: Audit Composer dependencies
        id: composer-audit
        continue-on-error: true
        run: composer audit

      - name: Preview Pint formatting for files reported by CI
        run: |
          files=(
            app/Policies/VoucherPackageDiscountPolicy.php
            app/Policies/VoucherPackagePolicy.php
            app/Services/NetworkWalletService.php
            app/Services/PosWalletService.php
          )
          vendor/bin/pint "${files[@]}"
          git --no-pager diff -- "${files[@]}"
          git checkout -- "${files[@]}"

      - name: Check PHP code style
        id: php-style
        continue-on-error: true
        run: vendor/bin/pint --test

      - name: Run Larastan / PHPStan analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Run Laravel tests
        run: php artisan test

      # These checks remain mandatory, but their failures no longer hide
      # the results of the remaining PHP validation steps.
      - name: Enforce Composer audit and PHP code-style gates
        if: steps.composer-audit.outcome == 'failure' || steps.php-style.outcome == 'failure'
        run: |
          echo "Composer audit and/or Pint reported a required quality-gate failure."
          exit 1
