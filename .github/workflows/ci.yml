name: Laravel CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Validate, audit, lint, analyse, and test
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: netsales_test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: netsales_test_db
      DB_USERNAME: root
      DB_PASSWORD: password
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, intl, zip
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Prepare test environment
        run: cp .env.example .env

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Generate application key for tests
        run: php artisan key:generate --force

      - name: Prepare isolated MySQL schema and reference data
        run: php artisan migrate:fresh --seed --force

      - name: Audit Composer dependencies
        id: composer-audit
        continue-on-error: true
        run: composer audit

      - name: Preview Pint formatting for files reported by CI
        run: |
          files=(
            app/Policies/VoucherPackageDiscountPolicy.php
            app/Policies/VoucherPackagePolicy.php
            app/Services/NetworkWalletService.php
            app/Services/PosWalletService.php
          )
          vendor/bin/pint "${files[@]}"
          git --no-pager diff -- "${files[@]}"
          git checkout -- "${files[@]}"

      - name: Check PHP code style
        id: php-style
        continue-on-error: true
        run: vendor/bin/pint --test

      - name: Run Larastan / PHPStan analysis
        id: phpstan
        continue-on-error: true
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Run Laravel tests
        id: php-tests
        continue-on-error: true
        run: php artisan test

      # Keep every check visible, then fail the job if any required gate fails.
      - name: Enforce Composer audit, PHP style, static-analysis, and test gates
        if: always() && (steps.composer-audit.outcome == 'failure' || steps.php-style.outcome == 'failure' || steps.phpstan.outcome == 'failure' || steps.php-tests.outcome == 'failure')
        run: |
          echo "Composer audit, Pint, PHPStan, and/or PHPUnit reported a required quality-gate failure."
          exit 1
