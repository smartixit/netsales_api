name: Laravel CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Validate, audit, lint, analyse, and test
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, intl, zip
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Prepare test environment
        run: cp .env.example .env

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Generate application key for tests
        run: php artisan key:generate --force

      - name: Audit Composer dependencies
        run: composer audit

      - name: Check PHP code style
        run: vendor/bin/pint --test

      - name: Run Larastan / PHPStan analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Run Laravel tests
        run: php artisan test
